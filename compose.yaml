services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meloli
      POSTGRES_USER: meloli
      POSTGRES_PASSWORD: meloli_dev
    volumes:
      - meloli_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloli -d meloli"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg2://meloli:meloli_dev@db:5432/meloli
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./apps/frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  meloli_db:
